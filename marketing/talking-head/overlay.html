<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Talking-head overlay</title>
<!--
  Transparent 1080x1920 graphics layer for talking-head reels, driven by window.EDIT (work/<name>.data.js)
  and window.__seek(t). Brand: navy #0b1a2e + electric blue #2563eb, Barlow Condensed + Inter.
  Captions sit over the chest (clear of the face and of the TikTok/Reels bottom UI).
-->
<style>
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-ExtraBold.ttf);font-weight:800}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-Black.ttf);font-weight:900}
@font-face{font-family:"Barlow Condensed";src:url(fonts/BarlowCondensed-Bold.ttf);font-weight:700}
@font-face{font-family:"Inter";src:url(fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:"Inter";src:url(fonts/Inter-700.ttf);font-weight:700}
:root{--navy:#0b1a2e;--blue:#2563eb;--sky:#9dbcff}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}

/* captions */
#cap{position:absolute;left:60px;right:60px;top:1150px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 18px;
  font:800 108px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.005em;transform-origin:50% 60%}
#cap .w{position:relative;display:inline-block;color:#fff;padding:6px 16px 10px;border-radius:16px;
  -webkit-text-stroke:12px rgba(11,26,46,.9);paint-order:stroke fill;text-shadow:0 6px 24px rgba(0,0,0,.35)}
#cap .w.em{color:var(--sky)}
#cap .w.on{background:var(--blue);color:#fff;-webkit-text-stroke:0;text-shadow:none;
  box-shadow:0 12px 30px -8px rgba(37,99,235,.7),0 0 0 3px rgba(255,255,255,.12) inset}

/* lower third */
#lt{position:absolute;left:64px;top:1390px;display:flex;align-items:stretch}
#lt .bar{width:10px;background:var(--blue);border-radius:3px 0 0 3px}
#lt .card{background:rgba(11,26,46,.93);padding:22px 34px 24px 28px;border-radius:0 14px 14px 0;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
#lt .nm{font:900 64px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.01em;color:#fff}
#lt .tt{font:600 25px/1 "Inter";letter-spacing:.16em;text-transform:uppercase;color:var(--sky);margin-top:12px}

/* end card */
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
#end .veil{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,rgba(11,26,46,.72),rgba(6,14,26,.93))}
#end .in{position:relative;display:flex;flex-direction:column;align-items:center}
#end .rule{width:90px;height:8px;border-radius:4px;background:var(--blue);margin-bottom:44px}
#end .nm{font:900 150px/.9 "Barlow Condensed";text-transform:uppercase;color:#fff;letter-spacing:.005em}
#end .tt{font:600 32px/1 "Inter";letter-spacing:.22em;text-transform:uppercase;color:var(--sky);margin-top:34px}
#end .cta{margin-top:80px;display:inline-flex;align-items:center;gap:16px;padding:26px 40px;border-radius:999px;background:var(--blue);
  font:700 38px/1 "Inter";color:#fff;box-shadow:0 24px 60px -20px rgba(37,99,235,.9)}
.rev{opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="cap"></div>
  <div id="lt" style="opacity:0"><div class="bar"></div><div class="card"><div class="nm" id="ltn"></div><div class="tt" id="ltt"></div></div></div>
  <div id="end"><div class="veil"></div><div class="in">
    <div class="rule rev" id="e0"></div><div class="nm rev" id="e1"></div><div class="tt rev" id="e2"></div><div class="cta rev" id="e3"></div>
  </div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const s = document.createElement('script'); s.src = q.get('data');
window.__ready = new Promise(r => { s.onload = r; }); document.head.appendChild(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = u => 1 - Math.pow(1 - u, 3), eb = u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
let lastChunk = null;
window.__seek = (t) => {
  const E = window.EDIT, cap = document.getElementById('cap');
  // captions
  const ch = t < E.speech ? E.chunks.find(c => t >= c.t0 && t < c.t1) : null;
  if (ch !== lastChunk) {
    cap.innerHTML = ch ? ch.w.map((w, i) => `<span class="w${w.em ? ' em' : ''}" data-i="${i}">${w.x}</span>`).join('') : '';
    lastChunk = ch;
  }
  if (ch) {
    const u = clamp((t - ch.t0) / 0.16);
    cap.style.transform = `scale(${0.82 + 0.18 * eb(u)})`; cap.style.opacity = eo(u);
    let act = -1;                                    // exactly one active word: the latest one that has started
    ch.w.forEach((w, i) => { if (t >= w.t0 - 0.03) act = i; });
    ch.w.forEach((w, i) => {
      const el = cap.children[i]; if (!el) return;
      el.classList.toggle('on', i === act);
      const k = clamp((t - (w.t0 - 0.03)) / 0.12);
      el.style.transform = el.classList.contains('on') ? `scale(${1 + 0.07 * Math.sin(k * Math.PI / 2)})` : 'scale(1)';
    });
  }
  // lower third: wipe in from the bar, hold, wipe out
  const L = E.lower, lt = document.getElementById('lt');
  if (L) {
    document.getElementById('ltn').textContent = L.name; document.getElementById('ltt').textContent = L.title;
    const a = clamp((t - L.t0) / 0.4), b = clamp((t - (L.t1 - 0.35)) / 0.35);
    const vis = t >= L.t0 && t < L.t1;
    lt.style.opacity = vis ? 1 : 0;
    const card = lt.querySelector('.card');
    card.style.clipPath = `inset(0 ${100 - 100 * eo(a) + 100 * eo(b)}% 0 0)`;
    lt.querySelector('.bar').style.transform = `scaleY(${eo(clamp((t - L.t0) / 0.2)) * (1 - eo(b))})`;
    card.firstChild.style.transform = `translateX(${-30 * (1 - eo(clamp((t - L.t0 - 0.1) / 0.45)))}px)`;
  }
  // end card
  const N = E.end, end = document.getElementById('end');
  if (N) {
    document.getElementById('e1').innerHTML = N.name.split(' ').join('<br>');
    document.getElementById('e2').textContent = N.title;
    document.getElementById('e3').innerHTML = N.cta + ' &rarr;';
    end.style.opacity = eo(clamp((t - N.t0) / 0.35));
    ['e0', 'e1', 'e2', 'e3'].forEach((id, i) => {
      const u = eo(clamp((t - N.t0 - 0.15 - i * 0.12) / 0.5));
      const el = document.getElementById(id);
      el.style.opacity = u; el.style.transform = `translateY(${36 * (1 - u)}px)`;
    });
  }
};
</script>
</body>
</html>
